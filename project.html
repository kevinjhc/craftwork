<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Craftwork Home</title>
  <!-- Old project URLs were project.html?p=<slug>; each project now has its own page. -->
  <script>
    const slug = new URLSearchParams(location.search).get("p");
    location.replace(slug && /^[a-z0-9-]+$/.test(slug) ? `work/${slug === "2327-house" ? "carriage-house" : slug}.html` : "work.html");
  </script>
</head>
<body>
  <p><a href="work.html">See all projects</a></p>
</body>
</html>
